### ・便利なツールのリンク。


[Privacy Tools](https://www.privacytools.io/)  
生き馬の目を抜く現代インターネット社会を生き残るための、プライバシー保護・セキュリティノウハウ。  
[Raspberry pi](https://www.raspberrypi.org)  
シングルボードコンピュータの先駆者にして王者。現時点での最新機種はRaspberry pi 3B+。その小さな身体にクアッドコア1.4Ghzとメモリ1GBを持ち、想像以上にパワフルに働いてくれる。コストパフォーマンスと応用性に優れた素敵な機械。  
[Lubuntu](https://lubuntu.net)  
このブログでおすすめしているLinuxディストリビューション。軽量でネットブックでも動作するが、デザインがややダサい。その代わりに軽く、余分な機能を持たない質実剛健なデスクトップ環境だ。  
[Pocket](https://getpocket.com)  
インターネットの記事を保存できるサービス。その真価は電子書籍リーダーkoboと連携したときに最大限発揮される。  
koboにはpocket連携サービスが付属しており、英字新聞などの記事を電子書籍リーダーに送ってゆっくりと読むことができる。koboはサービス開始当初の炎上騒ぎで日本でのブランド価値に傷がついたが、そのせいかフリマアプリで比較的安価に中古端末が入手可能。  
※ただ、日本語電子書籍の縦書きレイアウトがいまいち洗練されていない。かろうじて日本語が読める段階にとどまっていて、文字のフェチズムに乏しい。  
[Krita](https://krita.org/jp/)  
高機能ペイントソフト。ブラシのカスタマイズ機能が豊富。  
[ProtonVPN: Secure and Free VPN service for protecting your privacy](https://protonvpn.com/)  
無料プランでもそこそこ使い勝手のいいVPN。
[美佳のタイプトレーナ](http://www.asahi-net.or.jp/~BG8J-IMMR/)  
[「Mery」フリーの高機能テキストエディター - 窓の杜](https://forest.watch.impress.co.jp/library/software/mery/)  
私はMeryというテキストエディタを使っている。テキスト形式で管理できて、標準でアウトライン機能が付いているので文章を整理しやすい。  
* [ATOK.com | ジャストシステム](https://www.atok.com/)  
日本語を効率的に入力するための必須アプリケーション。  
[GitHub - featurecat/lizzie: Lizzie - Leela Zero Interface](https://github.com/featurecat/lizzie)  
AI囲碁ソフト。主に棋譜の検討に使う。  
[GitHub - lllyasviel/style2paints: sketch + style = paints](https://github.com/lllyasviel/style2paints)  
自動彩色ツール。自分でローカル環境にサーバーを建てないといけないので少し敷居は高い。  
[A quick guide to The Free Network](https://medium.com/we-distribute/a-quick-guide-to-the-free-network-c069309f334)  
[HUGO](https://gohugo.io)  
静的サイトジェネレータ。見栄えのいいブログやwebサイトが比較的簡単に作れる。  
[KeePass Password Safe](https://keepass.info/)  
パスワード管理  
[Nextcloud](https://nextcloud.com/)  
Dropboxの代わりに使っているクラウドストレージ。  

  
**Design**  
[Free Vectors, Textures, Icons, Logo Templates | OnlyGFX.com](https://www.onlygfx.com/)

[Clipart \- High Quality, Easy to Use, Free Support](https://openclipart.org/)  
[Book Cover Design Templates \| PosterMyWall](https://www.postermywall.com/index.php/g/book-cover-posters)  
  
**フリーフォント**  
[Google Web fonts](https://fonts.google.com)  
[源ノ明朝](https://source.typekit.com/source-han-serif/jp/)  
　GoogleとAdobeの開発したフリー日本語フォント。太さの種類が多く、ディスプレイでの表示もきれいだ。それ以外にもgoogleのweb fontsはフリーでありながらも豊富なデザインの書体が揃っている。  linuxにインストールするときには sudo apt-get install google-noto-cjk  
[源流明朝](https://github.com/ButTaiwan/genryu-font)  
[源雲明朝](https://github.com/ButTaiwan/genwan-font)
