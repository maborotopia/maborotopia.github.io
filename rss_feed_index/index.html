<div id="write-as-feed"></div>
<script>
fetch('https://write.as/metsa/feed/')
  .then(r => r.text())
  .then(text => {
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const items = Array.from(xml.querySelectorAll('item')).slice(0, 5);
    const el = document.getElementById('write-as-feed');
    el.innerHTML = '<h3>The dogs bark, but the caravan goes on</h3><ul>' +
      [...items].map(i => {
        const title = i.querySelector('title').textContent;
        const link = i.querySelector('link').textContent;
        const date = i.querySelector('pubDate').textContent;
        return `<li><a href="${link}">${title}</a> <small>${date}</small></li>`;
      }).join('') + '</ul>';
  })
  .catch(() => {
    document.getElementById('write-as-feed').textContent = '(feed unavailable)';
  });
</script>
