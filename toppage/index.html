      <div id="fediverse-gallery"></div>

<style>
  .fediverse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .fediverse-grid a {
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 6px;
    border: 1px solid lightgray;
  }
  .fediverse-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

<script>
(function() {
  
  const FEED_URL = 'https://framapiaf.org/@metsa_.rss';

  const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(FEED_URL);
  const container = document.getElementById('fediverse-gallery');

  fetch(proxyUrl)
    .then(r => {
      if (r.ok) return r.json();
      throw new Error('Network error');
    })
    .then(data => {
      const xml = new DOMParser().parseFromString(data.contents, 'text/xml');
      
      const items = Array.from(xml.querySelectorAll('item')).slice(0, 10);

      if (items.length === 0) {
        container.textContent = '(no posts in feed)';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'fediverse-grid';
      let imageCount = 0;

      items.forEach(item => {
        const postUrl = item.querySelector('link')?.textContent || '#';
        let mediaUrl = '';

        
        const enclosure = item.querySelector('enclosure[type^="image"]');
        if (enclosure) {
          mediaUrl = enclosure.getAttribute('url');
        }

        
        if (!mediaUrl) {
          const descriptionHtml = item.querySelector('description')?.textContent || '';
          const doc = new DOMParser().parseFromString(descriptionHtml, 'text/html');
          const img = doc.querySelector('img');
          if (img) mediaUrl = img.src;
        }

        
        if (mediaUrl) {
          imageCount++;
          const a = document.createElement('a');
          a.href = postUrl;
          a.target = '_blank';
          a.rel = 'noopener';

          const img = document.createElement('img');
          img.src = mediaUrl;
          img.loading = 'lazy';

          a.appendChild(img);
          grid.appendChild(a);
        }
      });

      if (imageCount === 0) {
        container.textContent = '(no images found in recent 10 posts)';
      } else {
        container.innerHTML = '';
        container.appendChild(grid);
      }
    })
    .catch(() => {
      if (container) container.textContent = '(feed unavailable)';
    });
})();
</script>
